<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:#0c1316;color:#fff;-webkit-font-smoothing:antialiased}
  a{color:#7fb6a6;text-decoration:none}
  a:hover{color:#a7d0c4}
</style>
</helmet>

<div style="width:100%;max-width:1440px;margin:0 auto;background:#0c1316;min-height:100vh;position:relative;overflow:hidden">
  <div style="position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:1180px;max-width:100%;z-index:0">
    <div style="position:absolute;inset:0;background-image:url('assets/bike-trails.png');background-size:cover;background-position:center 30%"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,19,22,0.45) 0%,rgba(12,19,22,0.4) 20%,rgba(12,19,22,0.62) 55%,rgba(12,19,22,0.85) 88%,#0c1316 100%)"></div>
  </div>
  <div style="position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 48px">

    <dc-import name="Header" active="" hint-size="100%,90px"></dc-import>

    <div style="padding:44px 0 30px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <span style="width:34px;height:1px;background:#8fc7b6"></span>
        <span style="font-size:12px;letter-spacing:3px;font-weight:600;color:#a7d0c4">RECOMMENDATIONS</span>
      </div>
      <h1 style="font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:52px;line-height:1;letter-spacing:-1.5px;margin:0">Bike &amp; Trails</h1>
      <p style="font-size:15px;color:rgba(255,255,255,0.6);margin:14px 0 0;max-width:560px">Where to ride and walk around the island.</p>
    </div>

    <div style="display:grid;gap:14px;padding-bottom:60px">
      <sc-for list="{{ recs }}" as="rec" hint-placeholder-count="4">
        <div style="background:rgba(12,19,22,0.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:22px 24px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px">
            <div style="font-size:18px;font-weight:700">{{ rec.name }}</div>
            <div style="font-size:12.5px;font-weight:600;color:#a7d0c4;background:rgba(111,167,147,0.14);border:1px solid rgba(111,167,147,0.25);padding:4px 12px;border-radius:20px;white-space:nowrap">{{ rec.tag }}</div>
          </div>
          <div style="font-size:14px;line-height:1.55;color:rgba(255,255,255,0.62)">{{ rec.desc }}</div>
          <a href="{{ rec.mapUrl }}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;font-weight:600;color:#7fb6a6">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="10" r="2.4"/></svg>
            Directions · {{ rec.drive }}
          </a>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 900 }
}">
class Component extends DCLogic {
  state = { houseInfoOpen: false };
  recs = [
    { name: 'Cross Island Path', tag: 'PATH', drive: 'At door', dest: 'Shelter Cove, Hilton Head Island, SC', desc: 'Paved bike path running across the island. Pick it up right at Shelter Cove.' },
    { name: 'Pinckney Island Refuge', tag: 'NATURE', drive: '8 min drive', dest: 'Pinckney Island National Wildlife Refuge, Hilton Head Island, SC', desc: 'Flat, scenic dirt trails through the marsh. Amazing wildlife.' },
    { name: 'Beach Riding (Low Tide)', tag: 'BEACH', drive: '10 min drive', dest: 'Coligny Beach Park, Hilton Head Island, SC', desc: 'Ride the hard sand at low tide \u2014 check tide chart first.' },
    { name: 'Hilton Head Bicycle Co.', tag: 'RENTALS', drive: '5 min drive', dest: 'Hilton Head Bicycle Company, Hilton Head Island, SC', desc: 'Rentals, repairs, and recommended routes if you brought your own.' },
    { name: 'Shelter Cove Loop', tag: 'EASY', drive: 'At door', dest: 'Shelter Cove Community Park, Hilton Head Island, SC', desc: 'Easy 4-mile loop around the marina + community. Good for kids.' },
  ];
  renderVals() {
    const origin = encodeURIComponent('Unit 7557, Shelter Cove, Hilton Head Island, SC');
    const recs = this.recs.map(r => ({
      ...r,
      mapUrl: `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${encodeURIComponent(r.dest)}`,
    }));
    return {
      recs,
      houseInfoOpen: this.state.houseInfoOpen,
      openHouseInfo: () => this.setState({ houseInfoOpen: true }),
      closeHouseInfo: () => this.setState({ houseInfoOpen: false }),
    };
  }
}
</script>
</body>
</html>
