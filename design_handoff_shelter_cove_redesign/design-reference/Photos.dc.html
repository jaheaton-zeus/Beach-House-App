<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="image-slot.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:#0c1316;color:#fff;-webkit-font-smoothing:antialiased}
  a{color:#7fb6a6;text-decoration:none}
  a:hover{color:#a7d0c4}
</style>
</helmet>

<div style="width:100%;max-width:1440px;margin:0 auto;background:#0c1316;min-height:100vh;position:relative;overflow:hidden">
  <div style="position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:1180px;max-width:100%;z-index:0">
    <div style="position:absolute;inset:0;background:radial-gradient(120% 70% at 50% -10%,rgba(111,167,147,0.16) 0%,rgba(12,19,22,0) 55%)"></div>
  </div>
  <div style="position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 48px">

    <dc-import name="Header" active="houseinfo" hint-size="100%,90px"></dc-import>

    <div style="padding:44px 0 30px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <span style="width:34px;height:1px;background:#8fc7b6"></span>
        <span style="font-size:12px;letter-spacing:3px;font-weight:600;color:#a7d0c4">HOUSE INFO</span>
      </div>
      <h1 style="font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:52px;line-height:1;letter-spacing:-1.5px;margin:0">Photos</h1>
      <p style="font-size:15px;color:rgba(255,255,255,0.6);margin:14px 0 0;max-width:560px">A look around the P/T Beach House. Drop your favorite shots into the gallery below.</p>
    </div>

    <div style="display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:150px;gap:14px;padding-bottom:70px">
      <sc-for list="{{ slots }}" as="slot" hint-placeholder-count="9">
        <image-slot id="{{ slot.id }}" placeholder="{{ slot.label }}" style="{{ slot.style }}"></image-slot>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 1000 } }">
class Component extends DCLogic {
  state = { slots: [] };
  async componentDidMount() {
    this.store = await import('./photo-store.js');
    this.reload();
    this._onSync = () => this.reload();
    window.addEventListener('storage', this._onSync);
    window.addEventListener('focus', this._onSync);
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this._onSync);
    window.removeEventListener('focus', this._onSync);
  }
  reload() {
    if (this.store) this.setState({ slots: this.store.getSlots() });
  }
  renderVals() {
    const slots = this.state.slots.map(s => ({
      ...s,
      style: `grid-column:span ${s.col};grid-row:span ${s.row};border-radius:16px`,
    }));
    return { slots };
  }
}
</script>
</body>
</html>
