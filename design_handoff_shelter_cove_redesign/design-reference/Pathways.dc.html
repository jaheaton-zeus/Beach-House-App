<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:#0c1316;color:#fff;-webkit-font-smoothing:antialiased}
  a{color:#7fb6a6;text-decoration:none}
  a:hover{color:#a7d0c4}
</style>
</helmet>

<div style="width:100%;max-width:1440px;margin:0 auto;background:#0c1316;min-height:100vh;position:relative;overflow:hidden">
  <div style="position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 48px">

    <dc-import name="Header" active="pathways" hint-size="100%,90px"></dc-import>

    <div style="padding:44px 0 26px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <span style="width:34px;height:1px;background:#8fc7b6"></span>
        <span style="font-size:12px;letter-spacing:3px;font-weight:600;color:#a7d0c4">ISLAND TRAIL MAP</span>
      </div>
      <h1 style="font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:52px;line-height:1;letter-spacing:-1.5px;margin:0">Public Pathways</h1>
      <p style="font-size:15px;color:rgba(255,255,255,0.6);margin:14px 0 0;max-width:620px">Hilton Head has 60+ miles of public bike paths. Tap a layer in the legend to see routes, then pinch to zoom around Shelter Cove.</p>
    </div>

    <div style="border:1px solid rgba(255,255,255,0.12);border-radius:16px;overflow:hidden;background:rgba(12,19,22,0.6);box-shadow:0 24px 60px rgba(0,0,0,0.4)">
      <iframe src="https://hiltonhead.maps.arcgis.com/apps/instant/interactivelegend/index.html?appid=8f2036039c5e471c96cbdd3664af9052" title="Hilton Head Island Public Pathways" style="display:block;width:100%;height:640px;border:0" loading="lazy" allowfullscreen></iframe>
    </div>

    <div style="display:flex;align-items:center;justify-content:center;padding:22px 0 60px">
      <a href="https://hiltonhead.maps.arcgis.com/apps/instant/interactivelegend/index.html?appid=8f2036039c5e471c96cbdd3664af9052" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:#7fb6a6">
        Open full map
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 900 } }">
class Component extends DCLogic {
  state = { houseInfoOpen: false };
  renderVals() {
    return {
      houseInfoOpen: this.state.houseInfoOpen,
      openHouseInfo: () => this.setState({ houseInfoOpen: true }),
      closeHouseInfo: () => this.setState({ houseInfoOpen: false }),
    };
  }
}
</script>
</body>
</html>
