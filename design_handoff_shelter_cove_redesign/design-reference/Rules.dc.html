<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:#0c1316;color:#fff;-webkit-font-smoothing:antialiased}
  a{color:#7fb6a6;text-decoration:none}
  a:hover{color:#a7d0c4}
</style>
</helmet>

<div style="width:100%;max-width:1440px;margin:0 auto;background:#0c1316;min-height:100vh;position:relative;overflow:hidden">
  <div style="position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:1180px;max-width:100%;z-index:0">
    <div style="position:absolute;inset:0;background-image:url('assets/house-rules.png');background-size:cover;background-position:center 30%"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,19,22,0.45) 0%,rgba(12,19,22,0.4) 20%,rgba(12,19,22,0.62) 55%,rgba(12,19,22,0.85) 88%,#0c1316 100%)"></div>
  </div>
  <div style="position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 48px">

    <!-- NAV -->
    <dc-import name="Header" active="houseinfo" hint-size="100%,90px"></dc-import>

    <!-- HEADING -->
    <div style="padding:44px 0 30px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <span style="width:34px;height:1px;background:#8fc7b6"></span>
        <span style="font-size:12px;letter-spacing:3px;font-weight:600;color:#a7d0c4">HOUSE INFO</span>
      </div>
      <h1 style="font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:52px;line-height:1;letter-spacing:-1.5px;margin:0">House Rules</h1>
      <p style="font-size:15px;color:rgba(255,255,255,0.6);margin:14px 0 0;max-width:560px">Keep things smooth so both families can enjoy.</p>
    </div>

    <!-- RULES LIST -->
    <div style="display:grid;gap:14px;padding-bottom:60px">
      <sc-for list="{{ rules }}" as="rule" hint-placeholder-count="8">
        <div style="display:flex;gap:18px;align-items:center;background:rgba(12,19,22,0.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:18px 22px">
          <div style="flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:rgba(111,167,147,0.16);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#a7d0c4">{{ rule.num }}</div>
          <div style="font-size:16px;font-weight:600">{{ rule.title }}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 980 }
}">
class Component extends DCLogic {
  rulesData = [
    'No smoking inside the house',
    'Max 6 guests at a time (2 BR / 2 BA)',
    'Quiet hours after 10pm — be neighborly',
    'Clean before you leave',
    'Notify the other family of any damage right away',
    'Pets allowed with prior heads-up',
    'Lock all doors when leaving',
    'Trash is taken out',
    'Set the thermostat to 75',
    'Unplug the dehumidifier',
    'Turn off all lights',
  ];
  renderVals() {
    return {
      rules: this.rulesData.map((title, i) => ({ num: i + 1, title })),
    };
  }
}
</script>
</body>
</html>
