<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:#0c1316;color:#fff;-webkit-font-smoothing:antialiased}
  a{color:#7fb6a6;text-decoration:none}
  a:hover{color:#a7d0c4}
</style>
</helmet>

<div style="width:100%;max-width:1440px;margin:0 auto;background:#0c1316;min-height:100vh;position:relative;overflow:hidden">
  <div style="position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:1180px;max-width:100%;z-index:0">
    <div style="position:absolute;inset:0;background-image:url('assets/activities.png');background-size:cover;background-position:center 30%"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,19,22,0.45) 0%,rgba(12,19,22,0.4) 20%,rgba(12,19,22,0.62) 55%,rgba(12,19,22,0.85) 88%,#0c1316 100%)"></div>
  </div>
  <div style="position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 48px">

    <dc-import name="Header" active="" hint-size="100%,90px"></dc-import>

    <div style="padding:44px 0 24px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <span style="width:34px;height:1px;background:#8fc7b6"></span>
        <span style="font-size:12px;letter-spacing:3px;font-weight:600;color:#a7d0c4">RECOMMENDATIONS</span>
      </div>
      <h1 style="font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:52px;line-height:1;letter-spacing:-1.5px;margin:0">Around the House</h1>
      <p style="font-size:15px;color:rgba(255,255,255,0.6);margin:14px 0 0;max-width:560px">Family favorites within walking or a short drive of Shelter Cove.</p>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:10px;padding-bottom:30px">
      <sc-for list="{{ chips }}" as="chip" hint-placeholder-count="6">
        <button onClick="{{ chip.onClick }}" style="{{ chip.style }}">{{ chip.label }}</button>
      </sc-for>
    </div>

    <div style="display:grid;gap:34px;padding-bottom:70px">
      <sc-for list="{{ groups }}" as="group" hint-placeholder-count="2">
        <div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <span style="width:8px;height:8px;border-radius:2px;background:#8fc7b6;transform:rotate(45deg)"></span>
            <span style="font-size:17px;font-weight:800;letter-spacing:-0.3px">{{ group.cat }}</span>
            <span style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.4)">· {{ group.count }}</span>
          </div>
          <div style="display:grid;gap:14px">
            <sc-for list="{{ group.items }}" as="rec" hint-placeholder-count="3">
              <div style="background:rgba(12,19,22,0.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:22px 24px">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px">
                  <div style="font-size:18px;font-weight:700">{{ rec.name }}</div>
                  <div style="font-size:12.5px;font-weight:600;color:#a7d0c4;background:rgba(111,167,147,0.14);border:1px solid rgba(111,167,147,0.25);padding:4px 12px;border-radius:20px;white-space:nowrap">{{ rec.tag }}</div>
                </div>
                <div style="font-size:14px;line-height:1.55;color:rgba(255,255,255,0.62)">{{ rec.desc }}</div>
                <a href="{{ rec.mapUrl }}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;font-weight:600;color:#7fb6a6">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="10" r="2.4"/></svg>
                  Directions · {{ rec.drive }}
                </a>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 900 } }">
class Component extends DCLogic {
  state = { filter: 'All' };
  cats = ['All', 'Dining', 'Activities', 'Groceries'];
  recs = [
    { category: 'Dining', name: "ELA's Blu Water Grille", tag: 'MARINA', drive: '5 min walk', dest: "ELA's Blu Water Grille, Shelter Cove Marina, Hilton Head Island, SC", desc: 'Waterfront dining at Shelter Cove Marina. Sunset reservations are everything.' },
    { category: 'Dining', name: "San Miguel's", tag: 'MARINA', drive: '5 min walk', dest: "San Miguel's Mexican Restaurant, Shelter Cove, Hilton Head Island, SC", desc: 'Casual Mexican right on the marina \u2014 frozen margaritas + tacos.' },
    { category: 'Dining', name: "Hudson's Seafood House", tag: 'SEAFOOD', drive: '10 min drive', dest: "Hudson's Seafood House on the Docks, Hilton Head Island, SC", desc: 'Local institution. Get the shrimp. Cash-friendly, no reservations.' },
    { category: 'Dining', name: 'Skull Creek Boathouse', tag: 'WATERFRONT', drive: '15 min drive', dest: 'Skull Creek Boathouse, Hilton Head Island, SC', desc: 'Sunset views, dock-and-dine. Good for groups.' },
    { category: 'Dining', name: 'Poseidon', tag: 'ROOFTOP', drive: '8 min walk', dest: 'Poseidon Coastal Cuisine, Shelter Cove Towne Centre, Hilton Head Island, SC', desc: 'Rooftop bar at Shelter Cove Towne Centre. Great for cocktails.' },

    { category: 'Beach', name: 'Burkes Beach', tag: 'BEACH', drive: '10 min drive', dest: 'Burkes Beach, Hilton Head Island, SC', desc: 'Closest public beach access. Wide sand, less crowded than Coligny.' },
    { category: 'Beach', name: 'Islanders Beach Park', tag: 'FAMILY', drive: '12 min drive', dest: 'Islanders Beach Park, Hilton Head Island, SC', desc: 'Resident-friendly, restrooms, picnic tables. Bring the parking pass.' },
    { category: 'Beach', name: 'Coligny Beach Park', tag: 'LIVELY', drive: '15 min drive', dest: 'Coligny Beach Park, Hilton Head Island, SC', desc: 'Big public beach with shops + restaurants nearby.' },
    { category: 'Beach', name: 'Driessen Beach Park', tag: 'QUIET', drive: '10 min drive', dest: 'Driessen Beach Park, Hilton Head Island, SC', desc: 'Boardwalk through the dunes. Great for sunrise walks.' },

    { category: 'Bike & Trails', name: 'Cross Island Path', tag: 'PATH', drive: 'At door', dest: 'Shelter Cove, Hilton Head Island, SC', desc: 'Paved bike path running across the island. Pick it up right at Shelter Cove.' },
    { category: 'Bike & Trails', name: 'Pinckney Island Refuge', tag: 'NATURE', drive: '8 min drive', dest: 'Pinckney Island National Wildlife Refuge, Hilton Head Island, SC', desc: 'Flat, scenic dirt trails through the marsh. Amazing wildlife.' },
    { category: 'Bike & Trails', name: 'Beach Riding (Low Tide)', tag: 'BEACH', drive: '10 min drive', dest: 'Coligny Beach Park, Hilton Head Island, SC', desc: 'Ride the hard sand at low tide \u2014 check tide chart first.' },
    { category: 'Bike & Trails', name: 'Hilton Head Bicycle Co.', tag: 'RENTALS', drive: '5 min drive', dest: 'Hilton Head Bicycle Company, Hilton Head Island, SC', desc: 'Rentals, repairs, and recommended routes if you brought your own.' },
    { category: 'Bike & Trails', name: 'Shelter Cove Loop', tag: 'EASY', drive: 'At door', dest: 'Shelter Cove Community Park, Hilton Head Island, SC', desc: 'Easy 4-mile loop around the marina + community. Good for kids.' },

    { category: 'Activities', name: 'Shelter Cove Marina', tag: 'MARINA', drive: '5 min walk', dest: 'Shelter Cove Marina, Hilton Head Island, SC', desc: 'Boats, dolphin tours, sunset cruises \u2014 all leave from here.' },
    { category: 'Activities', name: 'Harbour Town Lighthouse', tag: 'LANDMARK', drive: '20 min drive', dest: 'Harbour Town Lighthouse, Sea Pines, Hilton Head Island, SC', desc: 'Walk up for the view. Sea Pines fee at the gate.' },
    { category: 'Activities', name: 'Outside Hilton Head', tag: 'WATER', drive: '5 min walk', dest: 'Outside Hilton Head, Shelter Cove Marina, Hilton Head Island, SC', desc: 'Kayak + paddleboard rentals, marsh tours. Book ahead in summer.' },
    { category: 'Activities', name: 'Coastal Discovery Museum', tag: 'INDOOR', drive: '8 min drive', dest: 'Coastal Discovery Museum, Hilton Head Island, SC', desc: 'Free, easy walking trails + butterfly garden. Great rainy-day backup.' },

    { category: 'Groceries', name: 'Publix at Shelter Cove', tag: 'SHOPPING', drive: '8 min walk', dest: 'Publix Super Market at Shelter Cove Towne Centre, Hilton Head Island, SC', desc: 'Closest grocery, in the Towne Centre. Open until 10pm.' },
    { category: 'Groceries', name: 'Fresh Market', tag: 'SPECIALTY', drive: '5 min drive', dest: 'The Fresh Market, Hilton Head Island, SC', desc: 'Nicer produce + prepared foods. Worth the short drive.' },
    { category: 'Groceries', name: 'Harris Teeter (Coligny)', tag: 'SHOPPING', drive: '15 min drive', dest: 'Harris Teeter, Coligny Plaza, Hilton Head Island, SC', desc: 'Full-size grocery near Coligny Plaza, wide selection. Good for a big stock-up.' },
    { category: 'Groceries', name: 'Kroger (Pineland Station)', tag: 'SHOPPING', drive: '12 min drive', dest: 'Kroger, Pineland Station, Hilton Head Island, SC', desc: 'Large, well-stocked, usually less crowded than the Publix by the marina.' },
    { category: 'Groceries', name: 'Whole Foods Market', tag: 'SPECIALTY', drive: '15 min drive', dest: 'Whole Foods Market, Hilton Head Island, SC', desc: 'Organic + specialty groceries, good prepared foods bar for a quick dinner.' },
    { category: 'Groceries', name: 'Piggly Wiggly (Sea Pines Center)', tag: 'CONVENIENT', drive: '20 min drive', dest: 'Piggly Wiggly, Sea Pines Center, Hilton Head Island, SC', desc: 'Small, convenient, in-season for quick top-ups near Sea Pines.' },
    { category: 'Groceries', name: 'The Store (Bluffton)', tag: 'SPECIALTY', drive: '20 min drive', dest: 'The Store, Bluffton, SC', desc: 'Local butcher + market with excellent seafood and meats, worth the trip.' },
  ];
  renderVals() {
    const origin = encodeURIComponent('Unit 7557, Shelter Cove, Hilton Head Island, SC');
    const filter = this.state.filter;
    const base = 'padding:9px 18px;border-radius:30px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 0.15s;';
    const chips = this.cats.map(c => ({
      label: c,
      onClick: () => this.setState({ filter: c }),
      style: base + (c === filter
        ? 'background:#6fa793;border:1px solid #6fa793;color:#0c1316'
        : 'background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.16);color:rgba(255,255,255,0.85)'),
    }));
    const withUrl = r => ({ ...r, mapUrl: `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${encodeURIComponent(r.dest)}` });
    const order = this.cats.filter(c => c !== 'All');
    const shown = filter === 'All' ? order : [filter];
    const groups = shown.map(cat => {
      const items = this.recs.filter(r => r.category === cat).map(withUrl);
      return { cat, count: items.length, items };
    });
    return { chips, groups };
  }
}
</script>
</body>
</html>
