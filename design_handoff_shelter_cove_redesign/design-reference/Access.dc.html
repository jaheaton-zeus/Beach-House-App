<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:#0c1316;color:#fff;-webkit-font-smoothing:antialiased}
  a{color:#7fb6a6;text-decoration:none}
  a:hover{color:#a7d0c4}
</style>
</helmet>

<div style="width:100%;max-width:1440px;margin:0 auto;background:#0c1316;min-height:100vh;position:relative;overflow:hidden">
  <div style="position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:1180px;max-width:100%;z-index:0">
    <div style="position:absolute;inset:0;background-image:url('assets/wifi-access.png');background-size:cover;background-position:center 30%"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,19,22,0.45) 0%,rgba(12,19,22,0.4) 20%,rgba(12,19,22,0.62) 55%,rgba(12,19,22,0.85) 88%,#0c1316 100%)"></div>
  </div>
  <div style="position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 48px">

    <!-- NAV -->
    <dc-import name="Header" active="houseinfo" hint-size="100%,90px"></dc-import>

    <!-- HEADING -->
    <div style="padding:44px 0 30px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <span style="width:34px;height:1px;background:#8fc7b6"></span>
        <span style="font-size:12px;letter-spacing:3px;font-weight:600;color:#a7d0c4">HOUSE INFO</span>
      </div>
      <h1 style="font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:52px;line-height:1;letter-spacing:-1.5px;margin:0">Access</h1>
      <p style="font-size:15px;color:rgba(255,255,255,0.6);margin:14px 0 0;max-width:560px">Codes and details to get you in and connected during your stay.</p>
    </div>

    <!-- ACCESS LIST -->
    <div style="display:grid;gap:14px;padding-bottom:60px">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="5">
        <div style="display:flex;gap:18px;align-items:center;justify-content:space-between;background:rgba(12,19,22,0.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:20px 24px">
          <div>
            <div style="font-size:11px;letter-spacing:0.5px;color:rgba(255,255,255,0.45);margin-bottom:5px">{{ item.label }}</div>
            <div style="font-size:17px;font-weight:700">{{ item.value }}</div>
          </div>
          <div style="font-size:13px;color:rgba(255,255,255,0.55);max-width:320px;text-align:right">{{ item.note }}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 900 }
}">
class Component extends DCLogic {
  data = [
    { label: 'COMMUNITY GATE CODE', value: '1776#', note: '' },
    { label: 'UNIT', value: '7557', note: '' },
    { label: 'WIFI NETWORK', value: 'paradise7557', note: '' },
    { label: 'WIFI PASSWORD', value: 'happy123', note: '' },
    { label: 'PARKING', value: 'Unassigned lot parking at the building', note: '' },
    { label: 'ADDRESS', value: 'Unit 7557 · Shelter Cove, Hilton Head Island, SC', note: '' },
  ];
  state = { houseInfoOpen: false };
  renderVals() {
    return {
      items: this.data,
      houseInfoOpen: this.state.houseInfoOpen,
      openHouseInfo: () => this.setState({ houseInfoOpen: true }),
      closeHouseInfo: () => this.setState({ houseInfoOpen: false }),
    };
  }
}
</script>
</body>
</html>
